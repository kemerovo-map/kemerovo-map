<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кемерово: от индустриализации к современности</title>
    <link rel="shortcut icon" type="image/png" href="map.png">
    <script src="https://api-maps.yandex.ru/2.1/?apikey=4f9d3c26-2567-4016-bf13-0bc37eee8ec0&lang=ru_RU" type="text/javascript"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-size: 14px;
            z-index: 1000;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .legend-blue { background: #1e98ff; }
        .legend-red { background: #ff0000; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot legend-blue"></div>
            <span>Как всё начиналось</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot legend-red"></div>
            <span>Чем город стал</span>
        </div>
    </div>

    <script type="text/javascript">
        ymaps.ready(init);

        function init() {
            var myMap = new ymaps.Map("map", {
                center: [55.355, 86.100],
                zoom: 11,
                controls: ['zoomControl', 'fullscreenControl']
            });

            // МАРШРУТ 1: «Как всё начиналось» (синие метки)
            var route1 = [
                { 
                    coords: [55.375501, 86.071729], 
                    name: "Красная Горка", 
                    num: 1,
                    img: "krasnaya-gorka.jpg"
                },
                { 
                    coords: [55.374084, 86.078472], 
                    name: "Памятник «Память шахтёрам Кузбасса»", 
                    num: 2,
                    img: "pamyat-shahtyoram.jpg"
                },
                { 
                    coords: [55.34812, 86.075774], 
                    name: "Площадь Волкова", 
                    num: 3,
                    img: "ploshchad-volkova.jpg"
                }
            ];

            // МАРШРУТ 2: «Чем город стал» (красные метки)
            var route2 = [
                { 
                    coords: [55.351324, 86.100151], 
                    name: "Сибирский кластер искусств (Музейно-театральная часть)", 
                    num: 1,
                    img: "klaster-muzey.jpg"
                },
                { 
                    coords: [55.346332, 86.096641], 
                    name: "Памятник Александру Невскому", 
                    num: 2,
                    img: "nevskiy.jpg"
                },
                { 
                    coords: [55.358386, 86.127048], 
                    name: "Московская площадь", 
                    num: 3,
                    img: "moskovskaya-ploshchad.jpg"
                },
                { 
                    coords: [55.35984, 86.152002], 
                    name: "Мемориал Воину-Освободителю (Масалов)", 
                    num: 4,
                    img: "masalov.jpg"
                },
                { 
                    coords: [55.336875, 86.166281], 
                    name: "Академия хореографии", 
                    num: 5,
                    img: "horeografiya.jpg"
                },
                { 
                    coords: [55.337337, 86.168192], 
                    name: "Центральная музыкальная школа", 
                    num: 6,
                    img: "muz-shkola.jpg"
                },
                { 
                    coords: [55.337739, 86.161727], 
                    name: "Кампус РГИСИ", 
                    num: 7,
                    img: "rgisi.jpg"
                },
                { 
                    coords: [55.337570, 86.160157], 
                    name: "Фондохранилище", 
                    num: 8,
                    img: "fondohranilishche.jpg"
                }
            ];

            // Функция добавления меток
            function addPoints(points, color) {
                points.forEach(function(point) {
                    var balloonHtml = '<b>' + point.name + '</b>';
                    
                    if (point.img) {
                        balloonHtml += '<br><img src="' + point.img + '" style="width:100%; max-width:250px; margin-top:8px; border-radius:8px;">';
                    }

                    var placemark = new ymaps.Placemark(point.coords, {
                        hintContent: point.name,
                        balloonContent: balloonHtml,
                        iconContent: point.num
                    }, {
                        preset: 'islands#' + color + 'Icon'
                    });
                    myMap.geoObjects.add(placemark);
                });
            }

            // Маршрут 1 — синий, маршрут 2 — красный
            addPoints(route1, 'blue');
            addPoints(route2, 'red');
        }
    </script>
</body>
</html>
